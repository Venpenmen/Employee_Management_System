<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>设置正式密码</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="container"><h1>临时密码登录：请先设置正式密码</h1><p>当前不能访问业务功能。密码至少8位、最多72 UTF-8字节，包含字母和数字，不得继续使用临时密码。</p><p id="security-message" role="status"></p><input id="security-csrf" type="hidden" th:value="${profileCsrf}"><form class="security-form" data-endpoint="/api/security/temporary-password" data-redirect="/login?reason=password-changed"><label>正式新密码<input type="password" name="password" autocomplete="new-password" minlength="8" required></label><label>确认密码<input type="password" name="confirmPassword" autocomplete="new-password" required></label><button>设置密码并退出</button></form><form action="/logout" method="post"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><button>安全退出</button></form></main><script src="/js/security.js" defer></script></body></html>
