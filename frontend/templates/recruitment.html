<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>员工招聘</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div><div class="page-head"><div><h1>员工招聘</h1><p>单个招聘和 Excel 批量招聘集中在一个页面。</p></div></div><div class="two-cols"><section class="panel"><h2>招聘单个员工</h2><p class="muted">高层指定所属部门，具体职位由部门经理分配。</p><form class="stack top-gap" method="post" action="/admin/recruitment/single"><label>姓名<input name="name" maxlength="50" required></label><label>身份证号<input name="identityNumber" maxlength="18" pattern="[0-9]{17}[0-9Xx]" required></label><label>出生日期<input type="date" name="birthDate" required></label><label>入职日期<input type="date" name="hireDate" required></label><label>所属部门<select name="departmentId"><option value="">暂不分配</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.department_name}"></option></select></label><button class="primary">确认招聘并生成工号</button></form></section><section class="panel"><h2>Excel 批量招聘</h2><p class="muted">使用项目根目录附带的《初始员工导入列表.xlsx》。</p><form class="upload top-gap" method="post" action="/admin/recruitment/import" enctype="multipart/form-data"><input type="file" name="file" accept=".xlsx,.xls" required><button class="primary">上传并导入</button></form><div class="notice"><b>字段顺序必须保持不变</b><p>姓名、身份证号、出生日期、入职日期、部门名称、职位名称。</p><p>导入后员工处于“待注册”状态，使用系统生成的工号完成注册。</p></div></section></div><section class="panel" th:if="${result}"><h2>导入结果</h2><div class="stats"><div class="stat"><b th:text="${result.total}"></b><span>总记录</span></div><div class="stat"><b th:text="${result.success}"></b><span>成功</span></div><div class="stat"><b th:text="${#lists.size(result.errors)}"></b><span>失败</span></div></div><h3>生成的工号</h3><p th:text="${#strings.listJoin(result.employeeNos, ', ')}"></p><h3 th:if="${!#lists.isEmpty(result.errors)}">错误明细</h3><ul class="errors"><li th:each="e:${result.errors}" th:text="${e}"></li></ul></section></main></body></html>
