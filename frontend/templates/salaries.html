<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>薪资管理</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div><div class="page-head"><div><h1>薪资管理</h1><p>月结、调整、发布和导出员工工资条</p></div></div><section class="panel"><div class="salary-actions"><form method="post" action="/admin/salaries/settle"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><input type="month" name="month" required><button class="primary">生成月结工资条</button></form><form method="get"><input type="month" name="month" th:value="${month}"><button>查询</button></form><form method="post" action="/admin/salaries/publish"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><input type="hidden" name="month" th:value="${month}"><button class="primary" th:disabled="${month==null or month==''}">发布本月工资条</button></form><a class="button" th:if="${month!=null and month!=''}" th:href="@{/admin/salaries/export(month=${month})}">导出 Excel</a></div></section>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>月份</th><th>员工</th><th>部门/职位</th><th>基础+岗位</th><th>奖励/补贴/加班</th><th>扣款</th><th>实发</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="s:${records}"><td th:text="${s.salary_month}"></td><td th:text="${s.employee_no+' '+s.name}"></td><td th:text="${s.department_name_snapshot+' / '+s.position_name_snapshot}"></td><td th:text="${@viewFormats.money(s.department_base_salary)+' + '+@viewFormats.money(s.position_salary)}"></td><td th:text="${@viewFormats.money(s.reward)+' / '+@viewFormats.money(s.subsidy)+' / '+@viewFormats.money(s.overtime_pay)}"></td><td th:text="${@viewFormats.money(s.deduction+s.other_deduction)}"></td><td><b th:text="${@viewFormats.money(s.actual_salary)}"></b></td><td th:text="${s.status==3?'已发布':(s.status==4?'已作废':'待发布')}"></td><td><button class="small" type="button" th:if="${s.status<3}" th:attr="onclick=|document.getElementById('salary-${s.id}').showModal()|">调整</button></td></tr></tbody></table></div></section>
<dialog th:each="s:${records}" th:id="${'salary-'+s.id}"><form method="post" th:action="@{'/admin/salaries/'+${s.id}+'/adjust'}"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><h2 th:text="${s.name+' '+s.salary_month}"></h2><input type="hidden" name="month" th:value="${s.salary_month}"><div class="grid-form"><label>奖励<input type="number" step="0.01" min="0" name="reward" th:value="${s.reward}"></label><label>补贴<input type="number" step="0.01" min="0" name="subsidy" th:value="${s.subsidy}"></label><label>加班工资<input type="number" step="0.01" min="0" name="overtimePay" th:value="${s.overtime_pay}"></label><label>其他收入<input type="number" step="0.01" min="0" name="otherIncome" th:value="${s.other_income}"></label><label>扣款<input type="number" step="0.01" min="0" name="deduction" th:value="${s.deduction}"></label><label>其他扣款<input type="number" step="0.01" min="0" name="otherDeduction" th:value="${s.other_deduction}"></label></div><div class="dialog-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">保存</button></div></form></dialog></main></body></html>
