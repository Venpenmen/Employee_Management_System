<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>个人资料</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div class="page-head"><div><h1>个人资料</h1><p>查看账户对应的员工档案</p></div><a class="button" href="/password">修改密码</a></div><section class="panel detail-grid"><div><span>姓名</span><b th:text="${employee.name}"></b></div><div><span>工号</span><b th:text="${employee.employee_no}"></b></div><div><span>角色</span><b th:text="${currentUser.roleName()}"></b></div><div><span>手机号</span><b th:text="${employee.phone?:'未绑定'}"></b></div><div><span>身份证号</span><b th:text="${employee.masked_identity}"></b></div><div><span>出生日期</span><b th:text="${employee.birth_date}"></b></div><div><span>部门</span><b th:text="${employee.department_name?:'未分配'}"></b></div><div><span>职位</span><b th:text="${employee.position_name?:'未分配'}"></b></div><div><span>入职日期</span><b th:text="${employee.hire_date}"></b></div></section></main></body></html>
