<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 - EMS</title><link rel="stylesheet" href="/css/app.css"></head>
<body class="auth-page"><main class="auth-card"><div class="logo">EMS</div><h1>员工管理系统</h1><p class="muted">使用工号和密码登录</p><div th:replace="~{fragments :: messages}"></div>
<p class="alert error" th:if="${param.reason!=null and param.reason[0]=='other-login'}">账号已在其他设备登录</p><p class="alert" th:if="${param.reason!=null and param.reason[0]=='password-changed'}">密码已修改，请重新登录</p><p class="alert" th:if="${param.reason!=null and param.reason[0]=='expired'}">登录已失效，请重新登录</p><form method="post" action="/login"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><label>工号<input name="employeeNo" th:value="${employeeNo}" placeholder="请输入工号" required></label><label>密码<input type="password" name="password" placeholder="请输入密码" required></label><button class="primary wide">登录</button></form>
<p class="center"><a href="/register">已被招聘？完成员工注册</a></p></main></body></html>
