<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>我的工资条</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div class="page-head"><div><h1>我的工资条</h1><p>仅显示高层已经发布的工资条</p></div><form method="get"><input type="month" name="month" th:value="${month}"><button>查询</button></form></div><div class="payslips"><article class="payslip" th:each="s:${records}"><div class="payslip-head"><div><b th:text="${s.salary_month+' 工资条'}"></b><span th:text="${s.department_name_snapshot+' · '+s.position_name_snapshot}"></span></div><strong th:text="${@viewFormats.money(s.actual_salary)}"></strong></div><div class="salary-grid"><p><span>部门基础工资</span><b th:text="${@viewFormats.money(s.department_base_salary)}"></b></p><p><span>岗位工资</span><b th:text="${@viewFormats.money(s.position_salary)}"></b></p><p><span>奖励</span><b th:text="${@viewFormats.money(s.reward)}"></b></p><p><span>补贴</span><b th:text="${@viewFormats.money(s.subsidy)}"></b></p><p><span>加班工资</span><b th:text="${@viewFormats.money(s.overtime_pay)}"></b></p><p><span>其他收入</span><b th:text="${s.other_income}"></b></p><p><span>扣款</span><b th:text="${@viewFormats.money(s.deduction)}"></b></p><p><span>其他扣款</span><b th:text="${s.other_deduction}"></b></p></div></article><p class="empty" th:if="${#lists.isEmpty(records)}">暂无已发布工资条</p></div></main></body></html>
