<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>请假管理</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div><div class="page-head"><div><h1>请假管理</h1><p>提交请假申请并跟踪审批状态。普通员工由本部门经理审批，经理由高层审批。</p></div></div><section class="panel"><h2>提交请假申请</h2><form class="grid-form" method="post" action="/leaves"><label>请假类型<select name="leaveType" required><option value="">请选择</option><option th:each="t:${leaveTypes}" th:value="${t.item_value}" th:text="${t.item_label}"></option></select></label><label>开始时间<input type="datetime-local" name="startTime" required></label><label>结束时间<input type="datetime-local" name="endTime" required></label><label class="full-row">请假原因<textarea name="reason" maxlength="500" rows="3" required></textarea></label><div class="form-actions"><button class="primary">提交审批</button></div></form></section><section class="panel"><h2>我的申请</h2><div class="table-wrap"><table><thead><tr><th>申请编号</th><th>类型</th><th>开始时间</th><th>结束时间</th><th>时长</th><th>审批人</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="r:${requests}"><td th:text="${r.request_no}"></td><td th:text="${r.leave_type_label?:r.leave_type}"></td><td th:text="${r.start_time}"></td><td th:text="${r.end_time}"></td><td th:text="${r.leave_hours+' 小时'}"></td><td th:text="${r.approver_name?:'-'}"></td><td><span class="tag" th:text="${r.status==1?'待审批':(r.status==2?'已通过':(r.status==3?'已驳回':(r.status==4?'已撤回':'已取消')))}"></span></td><td><form method="post" th:if="${r.status==1}" th:action="@{'/leaves/'+${r.request_no}+'/withdraw'}" onsubmit="return confirm('确定撤回该申请吗？')"><button class="small">撤回</button></form></td></tr><tr th:if="${#lists.isEmpty(requests)}"><td colspan="8" class="empty">暂无请假申请</td></tr></tbody></table></div></section></main></body></html>
