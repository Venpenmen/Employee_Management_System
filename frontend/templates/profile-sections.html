<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="archive">
<section class="panel" id="contact"><div class="page-head"><h2>联系方式与补充信息</h2><a class="button small" href="/profile/edit" th:if="${profileEditable}">编辑资料</a></div><div class="detail-grid"><div><span>手机号</span><b class="profile-text" th:text="${archive.basic.phone?:'未填写'}"></b></div><div><span>邮箱</span><b class="profile-text" th:text="${archive.basic.email?:'未填写'}"></b></div><div><span>通讯地址</span><b class="profile-text" th:text="${archive.basic.address?:'未填写'}"></b></div><div><span>紧急联系人</span><b class="profile-text" th:text="${archive.basic.emergency_name?:'未填写'}"></b></div><div><span>联系人关系</span><b class="profile-text" th:text="${archive.basic.emergency_relation?:'未填写'}"></b></div><div><span>紧急联系电话</span><b class="profile-text" th:text="${archive.basic.emergency_phone?:'未填写'}"></b></div><div class="full-row"><span>个人简介</span><b class="profile-text" th:text="${archive.basic.biography?:'未填写'}"></b></div><div><span>性别</span><b th:text="${archive.basic.gender==null?'未填写':(archive.basic.gender=='0'?'女':'男')}"></b></div></div></section><section class="panel" id="education"><div class="page-head"><h2>教育经历</h2><a class="button small" href="/profile/education/new" th:if="${profileEditable}">添加教育经历</a></div>
<p class="muted" th:if="${#lists.isEmpty(archive.education)}">尚未填写教育经历</p><div class="table-wrap" th:unless="${#lists.isEmpty(archive.education)}"><table><thead><tr><th>学校</th><th>学历</th><th>专业</th><th>入学月份</th><th>结束／在读</th><th th:if="${profileEditable}">操作</th></tr></thead><tbody><tr th:each="r:${archive.education}"><td class="wrap profile-text" th:text="${r.school?:'未填写'}"></td><td class="wrap profile-text" th:text="${r.degree?:'未填写'}"></td><td class="wrap profile-text" th:text="${r.major?:'未填写'}"></td><td class="wrap profile-text" th:text="${r.start_month?:'未填写'}"></td><td class="wrap profile-text" th:text="${r.current_entry==1?'在读':r.end_month}"></td>
<td th:if="${profileEditable}"><div class="profile-actions"><a class="button small" th:href="@{/profile/education/{id}/edit(id=${r.id})}">编辑</a>
<form method="post" th:action="@{/profile/education/{id}/delete(id=${r.id})}" onsubmit="return confirm('确认删除这条教育经历吗？')"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><button class="danger small">删除</button></form></div></td></tr></tbody></table></div></section><section class="panel" id="experience"><div class="page-head"><h2>工作经历</h2><a class="button small" href="/profile/experience/new" th:if="${profileEditable}">添加工作经历</a></div>
<p class="muted" th:if="${#lists.isEmpty(archive.experience)}">尚未填写工作经历</p><div class="table-wrap" th:unless="${#lists.isEmpty(archive.experience)}"><table><thead><tr><th>单位</th><th>部门</th><th>职位</th><th>开始月份</th><th>结束／在职</th><th>工作描述</th><th th:if="${profileEditable}">操作</th></tr></thead><tbody><tr th:each="r:${archive.experience}"><td class="wrap profile-text" th:text="${r.company?:'未填写'}"></td><td class="wrap profile-text" th:text="${r.department?:'未填写'}"></td><td class="wrap profile-text" th:text="${r.position?:'未填写'}"></td><td class="wrap profile-text" th:text="${r.start_month?:'未填写'}"></td><td class="wrap profile-text" th:text="${r.current_entry==1?'在职':r.end_month}"></td><td class="wrap profile-text" th:text="${r.description?:'未填写'}"></td>
<td th:if="${profileEditable}"><div class="profile-actions"><a class="button small" th:href="@{/profile/experience/{id}/edit(id=${r.id})}">编辑</a>
<form method="post" th:action="@{/profile/experience/{id}/delete(id=${r.id})}" onsubmit="return confirm('确认删除这条工作经历吗？')"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><button class="danger small">删除</button></form></div></td></tr></tbody></table></div></section><section class="panel" id="skills"><div class="page-head"><h2>技能</h2><a class="button small" href="/profile/skills/new" th:if="${profileEditable}">添加技能</a></div>
<p class="muted" th:if="${#lists.isEmpty(archive.skills)}">尚未填写技能</p><div class="table-wrap" th:unless="${#lists.isEmpty(archive.skills)}"><table><thead><tr><th>名称</th><th>熟练程度</th><th>说明</th><th th:if="${profileEditable}">操作</th></tr></thead><tbody><tr th:each="r:${archive.skills}"><td class="wrap profile-text" th:text="${r.name?:'未填写'}"></td><td class="wrap profile-text" th:text="${r.proficiency?:'未填写'}"></td><td class="wrap profile-text" th:text="${r.notes?:'未填写'}"></td>
<td th:if="${profileEditable}"><div class="profile-actions"><a class="button small" th:href="@{/profile/skills/{id}/edit(id=${r.id})}">编辑</a>
<form method="post" th:action="@{/profile/skills/{id}/delete(id=${r.id})}" onsubmit="return confirm('确认删除这条技能吗？')"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><button class="danger small">删除</button></form></div></td></tr></tbody></table></div></section><section class="panel" id="certificates"><div class="page-head"><h2>证书</h2><a class="button small" href="/profile/certificates/new" th:if="${profileEditable}">添加证书</a></div>
<p class="muted" th:if="${#lists.isEmpty(archive.certificates)}">尚未填写证书</p><div class="table-wrap" th:unless="${#lists.isEmpty(archive.certificates)}"><table><thead><tr><th>名称</th><th>颁发机构</th><th>证书编号</th><th>取得日期</th><th>到期日期</th><th th:if="${profileEditable}">操作</th></tr></thead><tbody><tr th:each="r:${archive.certificates}"><td class="wrap profile-text" th:text="${r.name?:'未填写'}"></td><td class="wrap profile-text" th:text="${r.issuer?:'未填写'}"></td><td class="wrap profile-text" th:text="${r.certificate_number?:'未填写'}"></td><td class="wrap profile-text" th:text="${@viewFormats.date(r.obtained_date)?:'未填写'}"></td><td class="wrap profile-text" th:text="${@viewFormats.date(r.expiry_date)?:'未填写'}"></td>
<td th:if="${profileEditable}"><div class="profile-actions"><a class="button small" th:href="@{/profile/certificates/{id}/edit(id=${r.id})}">编辑</a>
<form method="post" th:action="@{/profile/certificates/{id}/delete(id=${r.id})}" onsubmit="return confirm('确认删除这条证书吗？')"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><button class="danger small">删除</button></form></div></td></tr></tbody></table></div></section><section class="panel" id="history"><h2>修改记录</h2><p class="muted">显示最近100条档案变更，仅记录操作和字段名称。</p><p th:if="${#lists.isEmpty(archive.history)}" class="muted">暂无修改记录</p><div class="table-wrap" th:unless="${#lists.isEmpty(archive.history)}"><table><thead><tr><th>时间</th><th>变更说明</th></tr></thead><tbody><tr th:each="h:${archive.history}"><td th:text="${@viewFormats.dateTime(h.create_time)}"></td><td class="wrap" th:text="${h.summary}"></td></tr></tbody></table></div></section></div></body></html>
