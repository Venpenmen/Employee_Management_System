<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>维护档案记录</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container narrow">
<div class="page-head"><div><h1 th:text="${(entryId==null?'添加':'编辑')+sectionLabel}"></h1><p>保存后可在个人档案中查看和继续维护。</p></div></div>
<section class="panel"><form class="stack" method="post" th:action="${saveUrl}" th:object="${form}" data-profile-edit th:attr="data-unsaved=${#fields.hasAnyErrors()}">
<input type="hidden" name="_csrf" th:value="${profileCsrf}"><div class="alert error" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div>
<div th:if="${kind=='education'}" class="grid-form"><label>学校<input type="text" th:field="*{school}" maxlength="100" required></label><label>学历<input type="text" th:field="*{degree}" maxlength="30" required></label><label>专业<input type="text" th:field="*{major}" maxlength="100" ></label><label>入学月份<input type="month" th:field="*{startMonth}"  required></label><label>结束月份<input type="month" th:field="*{endMonth}"  ></label><label class="profile-check full-row"><input type="checkbox" th:field="*{currentEntry}">目前在读（勾选时不填写结束月份）</label></div>
<div th:if="${kind=='experience'}" class="grid-form"><label>单位<input type="text" th:field="*{company}" maxlength="100" required></label><label>部门<input type="text" th:field="*{department}" maxlength="100" ></label><label>职位<input type="text" th:field="*{position}" maxlength="100" ></label><label>开始月份<input type="month" th:field="*{startMonth}"  required></label><label>结束月份<input type="month" th:field="*{endMonth}"  ></label><label class="profile-check full-row"><input type="checkbox" th:field="*{currentEntry}">目前在职（勾选时不填写结束月份）</label><label class="full-row">工作描述<textarea th:field="*{description}" rows="4" maxlength="1000"></textarea></label></div>
<div th:if="${kind=='skills'}" class="grid-form"><label>技能名称<input type="text" th:field="*{name}" maxlength="100" required></label><label>熟练程度<select th:field="*{proficiency}" required><option value="">请选择</option><option value="了解">了解</option><option value="熟悉">熟悉</option><option value="熟练">熟练</option><option value="精通">精通</option></select></label><label class="full-row">技能说明<textarea th:field="*{notes}" maxlength="500" rows="4"></textarea></label></div>
<div th:if="${kind=='certificates'}" class="grid-form"><label>证书名称<input type="text" th:field="*{name}" maxlength="100" required></label><label>颁发机构<input type="text" th:field="*{issuer}" maxlength="100" required></label><label>证书编号<input type="text" th:field="*{certificateNumber}" maxlength="100" ></label><label>取得日期<input type="date" th:field="*{obtainedDate}"  required></label><label>到期日期（长期有效可不填）<input type="date" th:field="*{expiryDate}"  ></label></div>
<div class="form-actions"><a class="button" href="/profile">取消</a><button class="primary">保存记录</button></div>
</form></section></main><script src="/js/profile-forms.js" defer></script></body></html>
