<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>员工注册</title><link rel="stylesheet" href="/css/app.css"></head>
<body class="auth-page"><main class="auth-card"><h1>员工注册</h1><p class="muted">仅限已被招聘并获得工号的员工</p><div th:replace="~{fragments :: messages}"></div><form method="post" action="/register">
<label>工号<input name="employeeNo" required></label><label>姓名<input name="name" required></label><label>身份证后六位<input name="identitySuffix" minlength="6" maxlength="6" required></label><label>手机号<input name="phone" required></label><label>密码<input type="password" name="password" minlength="8" required></label><label>确认密码<input type="password" name="confirmPassword" minlength="8" required></label><button class="primary wide">完成注册</button></form><p class="center"><a href="/login">返回登录</a></p></main></body></html>
