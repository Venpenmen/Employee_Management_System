<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>新建部门</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container narrow"><div th:replace="~{fragments :: messages}"></div><div class="page-head"><div><h1>新建部门</h1><p>创建后处于筹建状态，招聘员工后可在部门管理中任命经理。</p></div></div><section class="panel"><form class="stack" method="post" action="/admin/departments"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><label>部门名称<input name="name" maxlength="50" required></label><label>基础工资<input type="number" name="baseSalary" min="0" step="0.01" required></label><label>部门说明<textarea name="description" maxlength="255" rows="4"></textarea></label><div class="form-actions"><a class="button" href="/admin/departments">返回</a><button class="primary">创建筹建部门</button></div></form></section></main></body></html>
