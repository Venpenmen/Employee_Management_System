<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>新建职位</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container narrow"><div th:replace="~{fragments :: messages}"></div><div class="page-head"><div><h1>新建普通职位</h1><p>经理职位由系统在任命经理时自动维护。</p></div></div><section class="panel"><form class="stack" method="post" action="/admin/positions"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><label>所属部门<select name="departmentId" required><option value="">请选择部门</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.department_name}"></option></select></label><label>职位名称<input name="name" maxlength="50" required></label><label>岗位工资<input type="number" name="salary" min="0" step="0.01" required></label><div class="form-actions"><a class="button" href="/admin/positions/manage">返回</a><button class="primary">创建职位</button></div></form></section></main></body></html>
