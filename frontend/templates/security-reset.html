<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>使用一次性重置码</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="container"><h1>自行重置密码</h1><p>请使用高层核验身份后线下交付的重置码，30分钟内有效，仅能使用一次。</p><p id="security-message" role="status"></p><input id="security-csrf" type="hidden" th:value="${profileCsrf}"><form class="security-form" data-endpoint="/api/security/reset" data-redirect="/login?reason=password-changed"><label>工号<input name="employeeNo" pattern="[0-9]{6}" required></label><label>重置码<input type="password" name="code" autocomplete="off" required></label><label>正式新密码<input type="password" name="password" autocomplete="new-password" minlength="8" required></label><label>确认密码<input type="password" name="confirmPassword" autocomplete="new-password" required></label><button>重置并重新登录</button></form><a href="/login">返回登录</a></main><script src="/js/security.js" defer></script></body></html>
