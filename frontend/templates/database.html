<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>数据库管理 · EMS</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><h1>数据库管理</h1><p>仅高层可操作。每次操作重新验证登录密码。导入将整体替换数据，不合并员工；成功后所有人重新登录。</p><input id="csrf" type="hidden" th:value="${profileCsrf}"><form id="export"><h2>加密导出</h2><label>当前登录密码<input name="password" type="password" required autocomplete="current-password"></label><label>独立备份口令（12–256字符）<input name="backupPassword" type="password" minlength="12" maxlength="256" required></label><label>确认备份口令<input name="confirm" type="password" required></label><button>验证并导出</button></form><form id="import"><h2>导入前校验</h2><label>当前登录密码<input name="password" type="password" required></label><label>备份文件<input name="file" type="file" accept=".emsbk" required></label><label>备份口令<input name="backupPassword" type="password" required></label><button>隔离恢复并校验</button></form><form id="commit" hidden><h2>确认整库替换</h2><p>原库会自动加密备份并保留。切换期间短暂维护；备份中的账号和密码会替换当前账号。</p><label>当前高层密码<input name="password" type="password" required></label><label>备份内有效高层工号<input name="restoredEmployeeNo" required pattern="[0-9]{6}"></label><label>备份内该账号密码<input name="restoredPassword" type="password" required></label><button>确认备份并切换</button></form><p id="status" role="status"></p><a id="download" hidden>下载备份 ZIP</a><a href="/login">维护结束后重新登录</a></main><script src="/js/database.js"></script></body></html>
