<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="UTF-8"><title>数据库管理 · EMS</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/database.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><h1>数据库管理</h1><p>仅高层可操作。每次操作重新验证登录密码。导入将整体替换数据，不合并员工；成功后所有人重新登录。</p><nav aria-label="备份恢复方式"><button type="button" id="basic-mode" aria-pressed="true">基础备份／恢复</button><button type="button" id="advanced-mode" aria-pressed="false">高级兼容与回程</button></nav><p id="mode-description">日常备份和整库恢复。导入只生成隔离预览，确认前不切换当前数据库。</p><input id="csrf" type="hidden" th:value="${profileCsrf}"><form id="export"><h2>加密导出</h2><fieldset data-advanced hidden disabled><legend>配对兼容导出</legend><p>仅在需要使用受控旧版副本时选择 v1.2.0。基础备份、扩展包和回程证明须按说明共同保管。</p><label>导出目标<select name="targetVersion"><option value="current">当前版本标准备份</option><option value="1.2.0">v1.2.0 配对兼容包</option></select></label></fieldset><label>当前登录密码<input name="password" type="password" required autocomplete="current-password"></label><label>独立备份口令（12–256字符）<input name="backupPassword" type="password" minlength="12" maxlength="256" required></label><label>确认备份口令<input name="confirm" type="password" required></label><button>验证并导出</button></form><form id="import"><h2>导入前校验</h2><label>当前登录密码<input name="password" type="password" required></label><label>备份文件<input name="file" type="file" accept=".emsbk" required></label><fieldset data-advanced hidden disabled><legend>扩展与血缘证明</legend><label>原扩展包（可选）<input name="extension" type="file" accept=".emsbk"></label><label>受控旧版回程证明（可选）<input name="proof" type="file" accept=".emsbk"></label><p>旧版无扩展或证明时仅能基础升级；损坏或错配的扩展不会自动降级为成功。</p></fieldset><label>备份口令<input name="backupPassword" type="password" required></label><button>隔离恢复并校验</button></form><form id="commit" hidden><h2>确认整库替换</h2><p>原库会自动加密备份并保留。切换期间短暂维护；备份中的账号和密码会替换当前账号。</p><p id="preview-summary" aria-live="polite"></p><details id="preview-details"><summary>查看校验详情（不包含个人资料）</summary><pre id="preview" tabindex="0"></pre></details><label id="base-choice" hidden><input type="checkbox" name="acknowledgeBaseOnly" value="true">明确确认仅基础升级，不恢复未提供的扩展，不属于无损恢复</label><label id="skip-choice" hidden><input type="checkbox" name="skipConflicts" value="true">明确跳过预览列出的冲突扩展，保留旧版修改</label><label>当前高层密码<input name="password" type="password" required></label><label>备份内有效高层工号<input name="restoredEmployeeNo" required pattern="[0-9]{6}"></label><label>备份内该账号密码<input name="restoredPassword" type="password" required></label><button>确认备份并切换</button><button id="cancel-preview" type="button">取消本次确认</button></form><p id="status" role="status"></p><a id="download" hidden>下载备份 ZIP</a><a href="/login">维护结束后重新登录</a></main><script src="/js/database-view.js"></script><script src="/js/database.js"></script></body></html>
