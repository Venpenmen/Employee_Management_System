<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>部门管理</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div>
<div class="page-head"><div><h1>部门管理</h1><p>部门信息、经理任命和部门解散集中在此页面；职位通过独立入口维护。</p></div><div class="page-actions"><a class="button primary" href="/admin/departments/new">新建部门</a><a class="button" href="/admin/positions/new">新建职位</a><a class="button" href="/admin/positions/manage">职位管理</a></div></div>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>部门</th><th>状态</th><th>经理</th><th>人数</th><th>基础工资</th><th>任命经理</th><th>操作</th></tr></thead><tbody><tr th:each="d:${departments}"><td th:text="${d.department_name}"></td><td><span class="tag" th:text="${d.status==0?'筹建中':'正常'}"></span></td><td th:text="${d.manager_name==null?'待任命':d.manager_name+'（'+d.manager_no+'）'}"></td><td th:text="${d.employee_count}"></td><td th:text="${'¥'+d.base_salary}"></td><td><form class="inline" method="post" th:action="@{'/admin/departments/'+${d.id}+'/manager'}"><select name="employeeNo" required><option value="">请选择本部门员工</option><option th:each="candidate:${managerCandidates}" th:if="${candidate.department_id==d.id}" th:value="${candidate.employee_no}" th:selected="${candidate.employee_no==d.manager_no}" th:text="${candidate.name+'（'+candidate.employee_no+'，'+(candidate.position_name==null?'未分配职位':candidate.position_name)+'）'}"></option></select><button>任命/更换</button></form></td><td><button class="small" type="button" th:attr="onclick=|document.getElementById('edit-dept-${d.id}').showModal()|">编辑</button><form class="inline" method="post" th:action="@{'/admin/departments/'+${d.id}+'/delete'}" onsubmit="return confirm('请先调走除经理外的员工。系统会撤销原经理并将其转为未分配员工，确定解散吗？')"><button class="small danger">解散</button></form></td></tr></tbody></table></div><p class="hint">解散部门时只需先调走普通员工；剩余经理会自动撤职并转为未分配普通员工，历史数据继续保留。</p></section>
<dialog th:each="d:${departments}" th:id="${'edit-dept-'+d.id}"><form method="post" th:action="@{'/admin/departments/'+${d.id}+'/update'}"><h2>编辑部门</h2><label>部门名称<input name="departmentName" th:value="${d.department_name}" required></label><label>基础工资<input type="number" name="baseSalary" min="0" step="0.01" th:value="${d.base_salary}" required></label><label>部门说明<textarea name="description" th:text="${d.description}"></textarea></label><div class="dialog-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">保存</button></div></form></dialog></main></body></html>
