<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>员工详情</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div class="page-head"><div><h1 th:text="${employee.name}"></h1><p th:text="${employee.employee_no}"></p></div><a class="button" href="/employees">返回列表</a></div><section class="panel detail-grid"><div><span>员工类型</span><b th:text="${employee.user_type==2?'高层':(employee.user_type==1?'经理':'员工')}"></b></div><div><span>身份证号</span><b th:text="${employee.masked_identity}"></b></div><div><span>出生日期</span><b th:text="${employee.birth_date}"></b></div><div><span>手机号</span><b th:text="${employee.phone?:'未绑定'}"></b></div><div><span>所属部门</span><b th:text="${employee.department_name?:'未分配'}"></b></div><div><span>职位</span><b th:text="${employee.position_name?:'未分配'}"></b></div><div><span>基本工资</span><b th:text="${employee.basic_salary==null?'-':'¥'+employee.basic_salary}"></b></div><div><span>入职日期</span><b th:text="${employee.hire_date}"></b></div></section>
<section class="panel danger-zone" th:if="${currentUser.isExecutive() and employee.employment_status!=3 and employee.user_type!=2}"><h2>离职处理</h2><form method="post" th:action="@{'/employees/'+${employee.employee_no}+'/terminate'}"><input name="reason" placeholder="请输入离职原因" required><button class="danger">确认办理离职</button></form><p>经理必须先完成经理更换后才能离职。</p></section></main></body></html>
