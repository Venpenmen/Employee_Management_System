<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>操作日志</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div class="page-head"><div><h1>操作日志</h1><p>显示最近 200 条敏感业务操作</p></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>时间</th><th>操作人</th><th>操作类型</th><th>业务对象</th><th>说明</th><th>结果</th></tr></thead><tbody><tr th:each="l:${logs}"><td th:text="${l.create_time}"></td><td th:text="${l.operator_name==null?'系统':l.employee_no+' '+l.operator_name}"></td><td th:text="${l.operation_type}"></td><td th:text="${(l.target_type?:'-')+' #'+(l.target_id?:'-')}"></td><td th:text="${l.summary}"></td><td><span class="tag" th:text="${l.result}"></span></td></tr></tbody></table></div></section></main></body></html>
