<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>考勤管理</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div><div class="page-head"><div><h1>考勤管理</h1><p th:text="${currentUser.isExecutive()?'查看全公司考勤并修正异常记录':'查看本部门员工考勤'}"></p></div></div>
<section class="panel" th:if="${currentUser.isExecutive()}"><div class="section-head"><h2>考勤规则</h2><span class="muted" th:text="${'当前：'+rule.work_start_time+' - '+rule.work_end_time}"></span></div><form class="grid-form" method="post" action="/attendance/rule"><label>上班时间<input type="time" name="workStart" th:value="${rule.work_start_time}" required></label><label>下班时间<input type="time" name="workEnd" th:value="${rule.work_end_time}" required></label><label>迟到宽限分钟<input type="number" name="lateGrace" min="0" max="120" th:value="${rule.late_grace_minutes}" required></label><label>早退宽限分钟<input type="number" name="earlyGrace" min="0" max="120" th:value="${rule.early_grace_minutes}" required></label><div class="form-actions"><button class="primary">保存并启用新规则</button></div></form></section>
<section class="panel"><form class="filters" method="get"><input type="month" name="month" th:value="${month}"><input name="keyword" th:value="${keyword}" placeholder="姓名或工号"><select name="departmentId" th:if="${currentUser.isExecutive()}"><option value="">全部部门</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.department_name}"></option></select><button>查询</button></form><div class="table-wrap"><table><thead><tr><th>日期</th><th>工号</th><th>姓名</th><th>部门</th><th>上班</th><th>下班</th><th>状态</th><th>迟到/早退</th><th th:if="${currentUser.isExecutive()}">操作</th></tr></thead><tbody><tr th:each="r:${records}"><td th:text="${r.attendance_date}"></td><td th:text="${r.employee_no}"></td><td th:text="${r.name}"></td><td th:text="${r.department_name?:'未分配'}"></td><td th:text="${r.check_in_time?:'-'}"></td><td th:text="${r.check_out_time?:'-'}"></td><td><span class="tag" th:text="${r.attendance_status==0?'未完成':(r.attendance_status==1?'正常':(r.attendance_status==2?'迟到':(r.attendance_status==3?'早退':(r.attendance_status==4?'迟到且早退':(r.attendance_status==5?'缺卡':(r.attendance_status==6?'请假':(r.attendance_status==7?'旷工':'已修正')))))))}"></span></td><td th:text="${r.late_minutes+' / '+r.early_leave_minutes+' 分钟'}"></td><td th:if="${currentUser.isExecutive()}"><button class="small" type="button" th:attr="onclick=|document.getElementById('correct-${r.id}').showModal()|">修正</button></td></tr><tr th:if="${#lists.isEmpty(records)}"><td colspan="9" class="empty">没有符合条件的考勤记录</td></tr></tbody></table></div></section>
<dialog th:each="r:${records}" th:if="${currentUser.isExecutive()}" th:id="${'correct-'+r.id}"><form method="post" th:action="@{'/attendance/'+${r.id}+'/correct'}"><h2 th:text="${'修正考勤：'+r.name+'（'+r.employee_no+'）'}"></h2><label>修正后状态<select name="status" required><option value="1">正常</option><option value="2">迟到</option><option value="3">早退</option><option value="4">迟到且早退</option><option value="5">缺卡</option><option value="6">请假</option><option value="7">旷工</option><option value="8">已修正</option></select></label><label>修正原因<textarea name="reason" maxlength="255" required></textarea></label><input type="hidden" name="month" th:value="${month}"><div class="dialog-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">确认修正</button></div></form></dialog></main></body></html>
