<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="UTF-8"><title>考勤管理</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div><div class="page-head"><div><h1>考勤管理</h1><p th:text="${currentUser.isExecutive()?'查看全公司考勤并修正异常记录':'查看本部门员工考勤'}"></p></div></div>
<section class="panel" th:if="${currentUser.isExecutive()}"><div class="section-head"><h2>考勤规则</h2><span class="muted" th:text="${'当前：'+@viewFormats.time(rule.work_start_time)+' - '+@viewFormats.time(rule.work_end_time)}"></span></div><form class="grid-form" method="post" action="/attendance/rule"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><label>上班时间<input type="time" name="workStart" th:value="${rule.work_start_time}" required></label><label>下班时间<input type="time" name="workEnd" th:value="${rule.work_end_time}" required></label><label>迟到警告分钟<input type="number" name="lateGrace" min="0" max="1439" th:value="${rule.late_grace_minutes}" required></label><label>早退警告分钟<input type="number" name="earlyGrace" min="0" max="1439" th:value="${rule.early_grace_minutes}" required></label><label>签到异常分钟<input type="number" name="inException" min="0" max="1439" th:value="${rule.in_exception}" required></label>
<label>签退异常分钟<input type="number" name="outException" min="0" max="1439" th:value="${rule.out_exception}" required></label>
<label>最早签到<input type="time" name="earliestIn" th:value="${rule.earliest_in}" required></label>
<label>最晚签退<input type="time" name="latestOut" th:value="${rule.latest_out}" required></label>
<p th:text="|当前最晚签到 ${rule.last_in} · 最早签退 ${rule.first_out}|"></p>
<div class="form-actions"><button class="primary">保存规则</button></div></form></section>
<section class="panel" th:if="${currentUser.isExecutive()}">
  <h2>工作日例外</h2>
  <form class="grid-form" method="post" action="/attendance/calendar">
    <input type="hidden" name="_csrf" th:value="${profileCsrf}">
    <label>日期<input type="date" name="date" required></label>
    <label>类型<select name="workday"><option value="true">工作日</option><option value="false">休息日</option></select></label>
    <button>保存日期例外</button>
  </form>
  <ul th:unless="${#lists.isEmpty(calendarExceptions)}">
    <li th:each="entry:${calendarExceptions}" th:text="|${entry.calendar_date} · ${entry.workday==1?'工作日':'休息日'}|"></li>
  </ul>
</section>
<section class="panel" id="attendance-reviews" th:unless="${#lists.isEmpty(reviews)}">
  <h2>异常打卡核实</h2>
  <article th:each="r:${reviews}">
    <h3 th:text="|${r.name} · ${r.direction=='IN'?'签到':'签退'} · ${@viewFormats.dateTime(r.punched_at)}|"></h3>
    <p th:if="${r['missing_check_in']}">异常类型：缺少签到记录；审批通过也不会补造签到时间。</p>
    <p th:text="|偏离 ${r.deviation_minutes} 分钟 · ${r.reason}|"></p>
    <form class="grid-form" method="post" th:action="@{/attendance/requests/{id}/review(id=${r.id})}">
      <input type="hidden" name="_csrf" th:value="${profileCsrf}">
      <label>审批结论<select name="decision">
        <option value="AS_RECORDED">按原情况通过</option>
        <option value="AS_NORMAL" th:disabled="${r['missing_check_in']}">按正常通过（缺签到不可选）</option>
        <option value="REJECT">驳回</option>
      </select></label>
      <label>处理意见（按正常通过或驳回时必填）<textarea name="opinion" maxlength="500"></textarea></label>
      <button>提交审批</button>
    </form>
  </article>
</section>
<section class="panel"><form class="filters" method="get"><input type="month" name="month" th:value="${month}"><input name="keyword" th:value="${keyword}" placeholder="姓名或工号"><select name="departmentId" th:if="${currentUser.isExecutive()}"><option value="">全部部门</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.department_name}"></option></select><button>查询</button></form><div class="table-wrap"><table><thead><tr><th>日期</th><th>工号</th><th>姓名</th><th>部门</th><th>上班</th><th>下班</th><th>状态</th><th>迟到/早退</th><th>异常及审核</th><th th:if="${currentUser.isExecutive()}">操作</th></tr></thead><tbody><tr th:each="r:${records}"><td th:text="${@viewFormats.date(r.attendance_date)}"></td><td th:text="${r.employee_no}"></td><td th:text="${r.name}"></td><td th:text="${r.department_name?:'未分配'}"></td><td th:text="${@viewFormats.dateTime(r.check_in_time)?:'-'}"></td><td th:text="${@viewFormats.dateTime(r.check_out_time)?:'-'}"></td><td><span class="tag" th:text="${r.status_label}"></span></td><td th:text="${r.late_minutes+' / '+r.early_leave_minutes+' 分钟'}"></td>
    <td>
      <span th:if="${r.check_in_time == null and r.check_out_time != null}">缺少签到记录</span>
      <span th:if="${r.check_out_review_status != null}"
            th:text="${r.check_out_review_status=='PENDING'?' · 待审核':(r.check_out_review_status=='APPROVED'?' · 已通过':' · 已驳回')}"></span>
      <small th:if="${r.check_out_exception_reason != null}" th:text="${r.check_out_exception_reason}"></small>
      <span th:if="${r.check_in_time != null and r.check_out_review_status == null}">—</span>
    </td><td th:if="${currentUser.isExecutive()}"><button th:if="${r.id!=null}" class="small" type="button" th:attr="onclick=|document.getElementById('correct-${r.id}').showModal()|">修正</button></td></tr><tr th:if="${#lists.isEmpty(records)}"><td th:colspan="${currentUser.isExecutive()?10:9}" class="empty">没有符合条件的考勤记录</td></tr></tbody></table></div></section>
<dialog th:each="r:${records}" th:if="${currentUser.isExecutive() and r.id!=null}" th:id="${'correct-'+r.id}"><form method="post" th:action="@{'/attendance/'+${r.id}+'/correct'}"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><h2 th:text="${'修正考勤：'+r.name+'（'+r.employee_no+'）'}"></h2><label>修正后状态<select name="status" required><option value="1">正常</option><option value="2">迟到</option><option value="3">早退</option><option value="4">迟到且早退</option><option value="5">缺卡</option><option value="6">请假</option><option value="7">旷工</option><option value="8">已修正</option></select></label><label>修正原因<textarea name="reason" maxlength="255" required></textarea></label><input type="hidden" name="month" th:value="${month}"><div class="dialog-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">确认修正</button></div></form></dialog></main></body></html>
