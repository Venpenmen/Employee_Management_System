<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>系统错误</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="container narrow"><section class="panel"><h1>页面处理失败</h1><div class="alert error">系统在处理当前请求时发生异常。</div><p th:if="${message}" th:text="${message}"></p><p class="muted" th:if="${path}" th:text="${'请求路径：'+path}"></p><p><a class="button" href="javascript:history.back()">返回上一页</a> <a class="button primary" href="/dashboard">返回首页</a></p><p class="muted">如果问题再次出现，请查看 IDEA 运行窗口中最后一段 Caused by 信息。</p></section></main></body></html>
