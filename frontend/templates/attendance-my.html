<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>我的考勤</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div><div class="page-head"><div><h1>我的考勤</h1><p th:text="${'当前规则：'+rule.rule_name+'，上班 '+@viewFormats.time(rule.work_start_time)+'，下班 '+@viewFormats.time(rule.work_end_time)}"></p></div></div>
<section class="attendance-clock"><div><span>今日状态</span><strong th:text="${#maps.isEmpty(today)?'尚未打卡':(today.check_out_time!=null?'今日打卡已完成':'已上班打卡')}"></strong><p th:if="${!#maps.isEmpty(today)}" th:text="${'上班：'+(today.check_in_time==null?'-':@viewFormats.dateTime(today.check_in_time))+'　下班：'+(today.check_out_time==null?'-':@viewFormats.dateTime(today.check_out_time))}"></p></div><div class="clock-actions"><form method="post" action="/attendance/check-in"><button class="primary big-button" th:disabled="${!#maps.isEmpty(today)}">上班打卡</button></form><form method="post" action="/attendance/check-out"><button class="big-button" th:disabled="${#maps.isEmpty(today) or today.check_out_time!=null}">下班打卡</button></form></div></section>
<section class="stats"><div class="stat"><b th:text="${summary.normal_days}">0</b><span>正常</span></div><div class="stat"><b th:text="${summary.late_count}">0</b><span>迟到</span></div><div class="stat"><b th:text="${summary.early_count}">0</b><span>早退</span></div><div class="stat"><b th:text="${summary.missing_count}">0</b><span>缺卡</span></div><div class="stat"><b th:text="${summary.leave_days}">0</b><span>请假天数</span></div></section>
<section class="panel"><div class="section-head"><h2>个人考勤明细</h2><form class="inline" method="get"><input type="month" name="month" th:value="${month}"><button>查询</button></form></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>上班</th><th>下班</th><th>状态</th><th>迟到</th><th>早退</th><th>修正说明</th></tr></thead><tbody><tr th:each="r:${records}"><td th:text="${@viewFormats.date(r.attendance_date)}"></td><td th:text="${@viewFormats.dateTime(r.check_in_time)?:'-'}"></td><td th:text="${@viewFormats.dateTime(r.check_out_time)?:'-'}"></td><td><span class="tag" th:text="${r.attendance_status==0?'未完成':(r.attendance_status==1?'正常':(r.attendance_status==2?'迟到':(r.attendance_status==3?'早退':(r.attendance_status==4?'迟到且早退':(r.attendance_status==5?'缺卡':(r.attendance_status==6?'请假':(r.attendance_status==7?'旷工':'已修正')))))))}"></span></td><td th:text="${r.late_minutes+' 分钟'}"></td><td th:text="${r.early_leave_minutes+' 分钟'}"></td><td th:text="${r.correction_reason?:'-'}"></td></tr><tr th:if="${#lists.isEmpty(records)}"><td colspan="7" class="empty">本月暂无考勤记录</td></tr></tbody></table></div></section></main></body></html>
