<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>职位管理</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div><div class="page-head"><div><h1>职位管理</h1><p>修改职位名称与岗位工资，或删除无人使用的普通职位。</p></div><a class="button primary" href="/admin/positions/new">新建职位</a></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>部门</th><th>职位名称</th><th>类型</th><th>基本工资</th><th>操作</th></tr></thead><tbody><tr th:each="p:${positions}"><td th:text="${p.department_name}"></td><td th:text="${p.position_name}"></td><td><span class="tag" th:text="${p.is_manager_position==1?'经理职位':'普通职位'}"></span></td><td th:text="${@viewFormats.money(p.basic_salary)}"></td><td><button class="small" type="button" th:attr="onclick=|document.getElementById('edit-position-${p.id}').showModal()|">编辑</button><form class="inline" method="post" th:if="${p.is_manager_position==0}" th:action="@{'/admin/positions/'+${p.id}+'/delete'}" onsubmit="return confirm('仅无人使用的职位可以删除，确定继续吗？')"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><button class="small danger">删除</button></form></td></tr></tbody></table></div></section><dialog th:each="p:${positions}" th:id="${'edit-position-'+p.id}"><form method="post" th:action="@{'/admin/positions/'+${p.id}+'/update'}"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><h2>编辑职位</h2><label>所属部门<input th:value="${p.department_name}" disabled></label><label>职位名称<input name="positionName" th:value="${p.position_name}" th:readonly="${p.is_manager_position==1}" required></label><label>岗位工资<input type="number" name="positionSalary" min="0" step="0.01" th:value="${p.position_salary}" th:attr="data-department-base=${p.department_base_salary}" oninput="updatePositionSalaryPreview(this)" required></label><div class="position-salary-preview" aria-live="polite"><div>调整前基本工资：<strong th:text="${@viewFormats.money(p.basic_salary)}"></strong></div><div>调整后基本工资：<strong class="new-basic-salary" th:text="${@viewFormats.money(p.basic_salary)}"></strong></div></div><div class="dialog-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">保存</button></div></form></dialog><script>
function updatePositionSalaryPreview(input) {
 const output = input.closest('form').querySelector('.new-basic-salary');
 const raw = input.value.trim();
 const base = Number(input.dataset.departmentBase);
 const salary = Number(raw);
 if (raw === '' || !Number.isFinite(base) || !Number.isFinite(salary) || salary < 0) {
   output.textContent = '请输入有效的岗位工资';
   return;
 }
 output.textContent = new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY'}).format(base+salary);
}
</script></main></body></html>
