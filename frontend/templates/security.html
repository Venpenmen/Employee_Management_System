<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号安全中心</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><h1>账号安全中心</h1><p id="security-message" role="status"></p><input id="security-csrf" type="hidden" th:value="${profileCsrf}">
<section th:if="${currentUser.isExecutive()}"><h2 id="secondary">二级密码</h2><p th:text="${security.secondarySet ? '已设置。修改需要原二级密码，不影响普通业务会话。' : '尚未设置，仅强制重置和解除冻结时需要。首次设置请验证登录密码。'}"></p><form class="security-form" data-endpoint="/api/security/secondary"><label th:if="${!security.secondarySet}">登录密码<input type="password" name="loginPassword" autocomplete="current-password" required></label><label th:if="${security.secondarySet}">原二级密码<input type="password" name="oldSecondary" autocomplete="off" required></label><label>新二级密码<input type="password" name="password" autocomplete="new-password" minlength="8" required></label><label>确认新二级密码<input type="password" name="confirmPassword" autocomplete="new-password" required></label><button>保存二级密码</button></form></section>
<section th:if="${!currentUser.isExecutive()}"><h2>密码修改申请</h2><p>知道旧密码可直接使用原有修改密码功能。申请批准后，高层在线下核验身份并交付一次性重置码。</p><form class="security-form" data-endpoint="/api/security/requests"><label>申请原因<textarea name="reason" maxlength="500" required></textarea></label><button>提交申请</button></form></section>
<section><h2>密码申请记录</h2><table><thead><tr><th>申请ID</th><th>原因</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="r:${security.requests}"><td th:text="${r.id}"></td><td th:text="${r.reason}"></td><td th:text="${r.status}"></td><td><form class="security-form" th:if="${currentUser.isExecutive() and r.status=='PENDING'}" th:attr="data-endpoint=@{'/api/security/requests/'+${r.id}+'/approve'}"><button name="approve" value="true">核验身份后批准并生成重置码</button><button name="approve" value="false">拒绝</button></form><form class="security-form" th:if="${currentUser.isExecutive() and (r.status=='APPROVED' or r.status=='EXPIRED') and r.handling_method=='SELF'}" th:attr="data-endpoint=@{'/api/security/requests/'+${r.id}+'/reissue'}"><button>线下重新核验并签发新码</button></form><form class="security-form" th:if="${!currentUser.isExecutive() and r.status=='PENDING'}" th:attr="data-endpoint=@{'/api/security/requests/'+${r.id}+'/cancel'}"><button>撤回</button></form></td></tr></tbody></table></section>
<section th:if="${currentUser.isExecutive()}"><h2>员工与经理账号安全</h2><p>先核对目标身份；强制重置不会解除冻结、停用、离职或原有临时锁定。二级密码只授权本次操作。</p><table><thead><tr><th>工号</th><th>姓名</th><th>冻结原因</th><th>临时密码状态</th><th>操作</th></tr></thead><tbody><tr th:each="a:${security.accounts}"><td th:text="${a.employee_no}"></td><td th:text="${a.name}"></td><td th:text="${a.freeze_reason ?: '未冻结'}"></td><td th:text="${a.temporary_state}"></td><td><button type="button" data-sensitive="RESET" th:attr="data-target=${a.id},data-label=${a.employee_no+' '+a.name}">强制重置</button><button type="button" data-sensitive="UNFREEZE" th:if="${a.frozen==1}" th:attr="data-target=${a.id},data-label=${a.employee_no+' '+a.name}">解除安全冻结</button></td></tr></tbody></table></section>
<section><h2>安全通知</h2><form id="notice-filter"><label>事件类型<input name="type" maxlength="40"></label><label>工号或姓名<input name="query" maxlength="50"></label><label>开始日期<input type="date" name="from"></label><label>结束日期<input type="date" name="until"></label><label><input type="checkbox" name="unread" value="1">仅未读</label><button>查询</button></form><div id="security-notices" aria-live="polite"></div></section>
<dialog id="security-sensitive"><form id="sensitive-form"><h2 id="sensitive-label"></h2><label>二级密码<input type="password" name="secondary" autocomplete="off" required></label><label>处理理由（解冻必填，最多400字）<textarea name="reason" maxlength="400"></textarea></label><p>授权2分钟有效、仅限此目标及此操作。</p><button>验证并执行</button><button type="button" data-close>取消</button></form></dialog>
<dialog id="security-secret"><h2 id="secret-label"></h2><p>仅本次展示，请线下安全交付；关闭后不可再次查看。丢失需重新签发。</p><input id="secret-value" readonly autocomplete="off" aria-label="单次凭证"><button type="button" data-close>已记录，关闭</button></dialog>
</main><script src="/js/security.js" defer></script></body></html>
