<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>修改密码</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container narrow"><div class="page-head"><div><h1>修改密码</h1><p>新密码至少 8 位，并包含字母和数字</p></div></div><div th:replace="~{fragments :: messages}"></div><section class="panel"><form class="stack" method="post"><label>原密码<input type="password" name="oldPassword" required></label><label>新密码<input type="password" name="newPassword" minlength="8" required></label><label>确认新密码<input type="password" name="confirmPassword" minlength="8" required></label><button class="primary">保存新密码</button></form></section></main></body></html>
