<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>待我审批</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div><div class="page-head"><div><h1>待我审批</h1><p>只能处理系统分配给您的待审批申请，不能审批自己的申请。</p></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>申请编号</th><th>申请人</th><th>部门</th><th>类型</th><th>开始</th><th>结束</th><th>时长</th><th>原因</th><th>操作</th></tr></thead><tbody><tr th:each="r:${requests}"><td th:text="${r.request_no}"></td><td th:text="${r.name+'（'+r.employee_no+'）'}"></td><td th:text="${r.department_name?:'未分配'}"></td><td th:text="${r.leave_type_label?:r.leave_type}"></td><td th:text="${@viewFormats.dateTime(r.start_time)}"></td><td th:text="${@viewFormats.dateTime(r.end_time)}"></td><td th:text="${r.leave_hours+' 小时'}"></td><td class="wrap" th:text="${r.reason}"></td><td><button class="small primary" type="button" th:attr="onclick=|document.getElementById('approve-${r.request_no}').showModal()|">审批</button></td></tr><tr th:if="${#lists.isEmpty(requests)}"><td colspan="9" class="empty">目前没有待审批申请</td></tr></tbody></table></div></section><dialog th:each="r:${requests}" th:id="${'approve-'+r.request_no}"><h2 th:text="${'审批：'+r.name+'（'+r.employee_no+'）'}"></h2><p th:text="${r.reason}"></p><form method="post" th:action="@{'/leaves/'+${r.request_no}+'/approve'}"><label>审批意见（通过时可不填）<textarea name="opinion" maxlength="500"></textarea></label><div class="dialog-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">通过</button></div></form><form method="post" th:action="@{'/leaves/'+${r.request_no}+'/reject'}"><label>驳回意见（必填）<textarea name="opinion" maxlength="500" required></textarea></label><div class="dialog-actions"><button class="danger">驳回</button></div></form></dialog></main></body></html>
