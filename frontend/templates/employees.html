<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="UTF-8"><title>员工管理</title><link rel="stylesheet" href="/css/app.css"><style>
.employee-department-picker{position:relative;min-width:225px;z-index:5;font-size:13px}
.employee-department-picker>summary{cursor:pointer;border:1px solid #ccd2dc;border-radius:8px;padding:9px 12px;background:#fff;min-height:38px}
.employee-department-menu{position:absolute;top:calc(100% + 5px);left:0;z-index:25;width:max(100%,260px);max-width:min(340px,90vw);max-height:285px;overflow-y:auto;padding:6px;background:#fff;border:1px solid #d7dfee;border-radius:10px;box-shadow:0 12px 25px rgba(21,42,82,.14)}
.employee-department-menu label{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:9px 10px;border-radius:7px;cursor:pointer;min-height:38px}
.employee-department-menu label:hover{background:#eef3ff}
.employee-department-menu label span{flex:1;min-width:0;overflow-wrap:anywhere}
.employee-department-menu label input[type=checkbox]{flex:0 0 17px;width:17px!important;min-width:17px;height:17px;margin:0 0 0 auto;padding:0;accent-color:#3156d3}
.employee-department-menu .employee-department-select-all{border-bottom:1px solid #e3e9f3;font-weight:600}
.employee-department-menu .employee-department-unassigned{border-top:1px solid #e3e9f3}
@media(max-width:650px){.employee-department-picker{width:100%}.employee-department-menu{position:static;width:100%;max-width:none;max-height:260px;margin-top:5px;box-shadow:none}}
.employee-chat-link{display:inline-flex;align-items:center;margin-left:6px;white-space:nowrap}
</style></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div><div class="page-head"><div><h1 th:text="${currentUser.isExecutive() or currentUser.isManager()?'员工管理':'员工查看'}">员工查看</h1><p th:text="${currentUser.isExecutive()?'高层可以调动员工所属部门；具体职位由部门经理分配':(currentUser.isManager()?'可查看全公司基本信息；仅可调整本部门普通员工职位':'查看全公司员工的基本信息；不具备员工职位或部门调整权限。')}"></p></div></div>
<section class="panel"><form class="filters" id="employee-filter-form" method="get"><input name="keyword" th:value="${keyword}" placeholder="姓名或工号"><select name="status"><option value="">全部状态</option><option value="0" th:selected="${status==0}">待注册</option><option value="1" th:selected="${status==1}">在职</option><option value="2" th:selected="${status==2}">停用</option><option value="3" th:selected="${status==3}">已离职</option></select><details class="employee-department-picker" id="employee-department-picker">
<summary id="employee-department-summary">部门：全部部门</summary>
<div class="employee-department-menu" role="group" aria-label="选择要显示的部门">
<label class="employee-department-select-all"><span>全选部门</span><input type="checkbox" id="employee-department-all" aria-label="全选部门"></label>
<label th:each="d:${departments}"><span th:text="${d.department_name + (!currentUser.isExecutive() and myDepartmentId != null and myDepartmentId == d.id ? '（我的部门）' : '')}">部门</span><input type="checkbox" name="selectedDepartments" th:value="${d.id}" th:checked="${#lists.contains(selectedDepartmentIds,d.id)}"></label>
<label class="employee-department-unassigned"><span>未分配部门</span><input type="checkbox" name="includeUnassigned" value="true" th:checked="${includeUnassigned}"></label>
</div>
</details><input type="hidden" name="departmentFilter" value="1"><select name="pageSize" aria-label="每页条数"><option th:each="size:${T(java.util.List).of(20,50,100)}" th:value="${size}" th:selected="${pagination.pageSize==size}" th:text="${size+'条/页'}"></option></select><button>查询</button><a class="button" href="/employees">重置</a></form>
<div class="table-wrap"><table><thead><tr><th>工号</th><th>姓名</th><th>类型</th><th>部门</th><th>职位</th><th th:if="${currentUser.isExecutive()}">基本工资</th><th>入职日期</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="e:${employees}"><td th:text="${e.employee_no}"></td><td><a th:if="${currentUser.isExecutive()}" th:href="@{/employees/{no}(no=${e.employee_no},returnKeyword=${returnContext.keyword},returnDepartmentId=${returnContext.departmentId},returnStatus=${returnContext.status},returnPage=${returnContext.page},returnPageSize=${returnContext.pageSize})}" th:text="${e.name}"></a><span th:unless="${currentUser.isExecutive()}" th:text="${e.name}"></span></td><td th:text="${e.user_type==2?'高层':(e.user_type==1?'经理':'员工')}"></td><td th:text="${e.department_name?:'未分配'}"></td><td th:text="${e.position_name?:'待分配'}"></td><td th:if="${currentUser.isExecutive()}" th:text="${@viewFormats.money(e.basic_salary)}"></td><td th:text="${@viewFormats.date(e.hire_date)}"></td><td><span class="tag" th:text="${e.employment_status==0?'待注册':(e.employment_status==1?'在职':(e.employment_status==2?'停用':'已离职'))}"></span></td><td>
<button class="small" type="button" th:if="${currentUser.isExecutive() and e.employment_status==1 and e.user_type==0}" th:attr="onclick=|document.getElementById('department-${e.employee_no}').showModal()|">调动部门</button>
<button class="small" type="button" th:if="${currentUser.isManager() and e.employment_status==1 and e.user_type==0 and e.department_id==currentUser.departmentId()}" th:attr="onclick=|document.getElementById('position-${e.employee_no}').showModal()|">调整职位</button>
<a class="button small employee-chat-link" th:if="${e.id != currentUser.id() and e.employment_status==1}" th:href="@{/communications(employee=${e.id})}" aria-label="发起私聊">私聊</a>
</td></tr><tr th:if="${#lists.isEmpty(employees)}"><td colspan="9">没有符合条件的员工，请调整筛选或重置。</td></tr></tbody></table></div><div class="pagination"><span th:text="${'共 '+pagination.total+' 条 · 第 '+pagination.page+' / '+pagination.totalPages+' 页'}"></span><button class="button small" type="submit" form="employee-filter-form" name="page" th:value="${pagination.page-1}" th:if="${pagination.page>1}">上一页</button><button class="button small" type="submit" form="employee-filter-form" name="page" th:value="${pagination.page+1}" th:if="${pagination.page<pagination.totalPages}">下一页</button></div></section>

<dialog th:each="e:${employees}" th:if="${currentUser.isExecutive() and e.employment_status==1 and e.user_type==0}" th:id="${'department-'+e.employee_no}"><form method="post" th:action="@{'/employees/'+${e.employee_no}+'/department'}"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><div th:replace="~{employee-return :: returnFields}"></div><h2 th:text="${'调动员工：'+e.name+'（'+e.employee_no+'）'}"></h2><p>调动后职位将清空，由新部门经理重新分配。</p><label>目标部门<select name="departmentId" required><option value="">请选择部门</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.department_name}" th:disabled="${d.id==e.department_id}"></option></select></label><label>调动原因<input name="reason" required></label><div class="dialog-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">确认调动</button></div></form></dialog>

<dialog th:each="e:${employees}" th:if="${currentUser.isManager() and e.employment_status==1 and e.user_type==0 and e.department_id==currentUser.departmentId()}" th:id="${'position-'+e.employee_no}"><form method="post" th:action="@{'/employees/'+${e.employee_no}+'/position'}"><input type="hidden" name="_csrf" th:value="${profileCsrf}"><div th:replace="~{employee-return :: returnFields}"></div><h2 th:text="${'调整职位：'+e.name+'（'+e.employee_no+'）'}"></h2><p th:text="${'所属部门：'+currentUser.departmentName()}"></p><label>本部门普通职位<select name="positionId" required><option value="">请选择职位</option><option th:each="p:${positions}" th:value="${p.id}" th:text="${p.position_name}" th:selected="${p.id==e.position_id}"></option></select></label><label>调整原因<input name="reason" required></label><div class="dialog-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">保存职位</button></div></form></dialog>
</main><script>
(() => {
  const picker = document.getElementById('employee-department-picker');
  const items = [...picker.querySelectorAll('input[name="selectedDepartments"],input[name="includeUnassigned"]')];
  const all = document.getElementById('employee-department-all');
  const summary = document.getElementById('employee-department-summary');
  function sync() {
    const checked = items.filter(item => item.checked);
    all.checked = checked.length === items.length;
    all.indeterminate = checked.length > 0 && !all.checked;
    const departmentCount = items.filter(item => item.name === 'selectedDepartments' && item.checked).length;
    summary.textContent = all.checked ? '部门：全部部门' : '部门：已选 ' + departmentCount + ' 个' +
      (items.find(item => item.name === 'includeUnassigned')?.checked ? '（含未分配）' : '');
  }
  all.addEventListener('change', () => { items.forEach(item => item.checked = all.checked); sync(); });
  items.forEach(item => item.addEventListener('change', sync));
  sync();
})();
</script></body></html>
