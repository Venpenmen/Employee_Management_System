<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>员工管理</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div><div class="page-head"><div><h1>员工管理</h1><p th:text="${currentUser.isExecutive()?'高层可以调动员工所属部门；具体职位由部门经理分配':'经理只能调整本部门普通员工的具体职位'}"></p></div></div>
<section class="panel"><form class="filters" method="get"><input name="keyword" th:value="${keyword}" placeholder="姓名或工号"><select name="departmentId" th:if="${currentUser.isExecutive()}"><option value="">全部部门</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.department_name}"></option></select><select name="status"><option value="">全部状态</option><option value="0">待注册</option><option value="1">在职</option><option value="2">停用</option><option value="3">已离职</option></select><button>查询</button></form>
<div class="table-wrap"><table><thead><tr><th>工号</th><th>姓名</th><th>类型</th><th>部门</th><th>职位</th><th th:if="${currentUser.isExecutive()}">基本工资</th><th>入职日期</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="e:${employees}"><td th:text="${e.employee_no}"></td><td><a th:if="${currentUser.isExecutive()}" th:href="@{'/employees/'+${e.employee_no}}" th:text="${e.name}"></a><span th:unless="${currentUser.isExecutive()}" th:text="${e.name}"></span></td><td th:text="${e.user_type==2?'高层':(e.user_type==1?'经理':'员工')}"></td><td th:text="${e.department_name?:'未分配'}"></td><td th:text="${e.position_name?:'待分配'}"></td><td th:if="${currentUser.isExecutive()}" th:text="${e.basic_salary==null?'-':'¥'+e.basic_salary}"></td><td th:text="${e.hire_date}"></td><td><span class="tag" th:text="${e.employment_status==0?'待注册':(e.employment_status==1?'在职':(e.employment_status==2?'停用':'已离职'))}"></span></td><td>
<button class="small" type="button" th:if="${currentUser.isExecutive() and e.employment_status==1 and e.user_type==0}" th:attr="onclick=|document.getElementById('department-${e.employee_no}').showModal()|">调动部门</button>
<button class="small" type="button" th:if="${currentUser.isManager() and e.employment_status==1 and e.user_type==0 and e.department_id==currentUser.departmentId()}" th:attr="onclick=|document.getElementById('position-${e.employee_no}').showModal()|">调整职位</button>
</td></tr></tbody></table></div></section>

<dialog th:each="e:${employees}" th:if="${currentUser.isExecutive() and e.employment_status==1 and e.user_type==0}" th:id="${'department-'+e.employee_no}"><form method="post" th:action="@{'/employees/'+${e.employee_no}+'/department'}"><h2 th:text="${'调动员工：'+e.name+'（'+e.employee_no+'）'}"></h2><p>调动后职位将清空，由新部门经理重新分配。</p><label>目标部门<select name="departmentId" required><option value="">请选择部门</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.department_name}" th:disabled="${d.id==e.department_id}"></option></select></label><label>调动原因<input name="reason" required></label><div class="dialog-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">确认调动</button></div></form></dialog>

<dialog th:each="e:${employees}" th:if="${currentUser.isManager() and e.employment_status==1 and e.user_type==0 and e.department_id==currentUser.departmentId()}" th:id="${'position-'+e.employee_no}"><form method="post" th:action="@{'/employees/'+${e.employee_no}+'/position'}"><h2 th:text="${'调整职位：'+e.name+'（'+e.employee_no+'）'}"></h2><p th:text="${'所属部门：'+currentUser.departmentName()}"></p><label>本部门普通职位<select name="positionId" required><option value="">请选择职位</option><option th:each="p:${positions}" th:value="${p.id}" th:text="${p.position_name}" th:selected="${p.id==e.position_id}"></option></select></label><label>调整原因<input name="reason" required></label><div class="dialog-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">保存职位</button></div></form></dialog>
</main></body></html>
