# Windows 免安装便携版配置（由 launcher/start-ems.ps1 以 --spring.profiles.active=portable 启动）。
# 发行 JAR 不包含开发 application.yml，因此本文件必须自包含全部运行配置。
# 端口、数据库口令和实例令牌只来自启动器注入的环境变量，不写入任何文件。
server:
  address: 127.0.0.1
  port: ${EMS_HTTP_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${EMS_DB_PORT:13306}/ems_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ems_app
    password: ${EMS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 便携数据库账号只有增删改查权限；建表和档案升级由启动器在后端启动前执行
      mode: never
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ems:
  browser:
    # 浏览器由启动器在就绪检查通过后打开
    auto-open: false
  portable:
    token: ${EMS_INSTANCE_TOKEN:}

logging:
  level:
    com.example.ems: INFO
