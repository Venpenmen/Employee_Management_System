server:
  address: 127.0.0.1
  port: ${EMS_HTTP_PORT:8281}
  servlet:
    session:
      cookie:
        name: EMS120U_PORTABLE
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${EMS_DB_PORT}/${EMS_DATABASE_NAME:ems_up_portable_v120}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ems_app
    password: ${EMS_DB_PASSWORD}
  sql:
    init:
      mode: never
  thymeleaf:
    cache: true
ems:
  browser-auto-open: false
  instance-token: ${EMS_INSTANCE_TOKEN:}
