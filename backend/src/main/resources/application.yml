server:
  forward-headers-strategy: none
  ssl:
    enabled: ${EMS_TLS_ENABLED:false}
    key-store: ${EMS_TLS_KEYSTORE:}
    key-store-password: ${EMS_TLS_STORE_PASSWORD:}
    key-store-type: PKCS12
  address: 127.0.0.1
  port: ${EMS_DEV_HTTP_PORT:8482}
  shutdown: graceful
  error:
    include-message: never
  servlet:
    session:
      persistent: false
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: EMS121N_COMPLETE_DEV
        http-only: true
        same-site: lax
        secure: ${EMS_COOKIE_SECURE:false}
spring:
  flyway:
    enabled: false
  datasource:
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      maximum-pool-size: 10
      minimum-idle: 2
    url: jdbc:mysql://127.0.0.1:${EMS_DEV_DB_PORT:16608}/${EMS_DEV_DB_NAME:ems_next_dev_v121}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ems_app
    password: ${EMS_DEV_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 1025MB
ems:
  rc2:
    enabled: ${EMS_RC2_ENABLED:false}
  compatibility:
    enabled: ${EMS_COMPATIBILITY_ENABLED:false}
  browser-auto-open: true
logging:
  level:
    com.example.ems: INFO
