server:
  address: ${EMS_SERVER_ADDRESS:127.0.0.1}
  port: ${EMS_SERVER_PORT:8483}
  servlet:
    session:
      cookie:
        name: EMS121N_COMPLETE_SERVER
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${EMS_DB_PORT}/${EMS_DATABASE_NAME:ems_next_server_v121}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ems_app
    password: ${EMS_DB_PASSWORD}
  sql:
    init:
      mode: never
  thymeleaf:
    cache: true
ems:
  browser-auto-open: false
  instance-token: ${EMS_INSTANCE_TOKEN:}
